plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.survive.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.survive.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}